<!doctype html>
<html lang="en">
  <head>
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8" />
    <link rel="icon" href="/wallet.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyWallet2.1</title>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
  <script>
    window.addEventListener(
      "error",
      function (e) {
        if (
          e.target &&
          (e.target.tagName === "SCRIPT" || e.target.tagName === "LINK")
        ) {
          const lastReload = sessionStorage.getItem("app-auto-reload");
          const now = Date.now();

          if (!lastReload || now - parseInt(lastReload) > 10000) {
            console.warn(
              "Обнаружен устаревший кэш (404). Принудительное обновление...",
            );
            sessionStorage.setItem("app-auto-reload", now.toString());

            window.location.href =
              window.location.origin + window.location.pathname + "?v=" + now;
          }
        }
      },
      true,
    );
  </script>
</html>
